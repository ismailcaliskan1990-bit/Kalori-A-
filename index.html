<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalori Açığı 1907</title><style>*{box-sizing:border-box}body{background:#061333;color:white;font:16px Arial;margin:auto;max-width:480px;padding:16px}header{text-align:center}h1,h2,strong{color:#ffdc00}section{background:#11244b;border:1px solid #34446a;border-radius:20px;padding:16px;margin:14px 0}input,select,button{width:100%;padding:12px;border:0;border-radius:10px;margin:5px 0;font-size:16px}button{background:#ffdc00;color:#061333;font-weight:bold}progress{width:100%;accent-color:#ffdc00}small{color:#bbc8df}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #34446a}.item button{width:auto} [hidden]{display:none!important}</style><header><img width="90" src="https://upload.wikimedia.org/wikipedia/en/3/39/Fenerbah%C3%A7e_SK.svg" alt="Fenerbahçe"><h1>KALORİ AÇIĞI</h1>💛💙 1907 • Disiplin • Güç • Başarı</header><section><input id="date" type="date" onchange="render()"><h2>Günlük hedef: 1800 kcal</h2><strong id="total"></strong><progress id="bar" max="1800"></progress><p id="remaining"></p></section><section><h2>🍽️ Öğün ekle</h2><select id="meal"><option>Kahvaltı<option>Öğle yemeği<option>Akşam yemeği<option>Ara öğün</select><input id="food" placeholder="Yemek adı"><input id="cal" type="number" min="1" placeholder="Kalori"><button onclick="add('foods','food','cal',el('meal').value+' - ')">Öğün kaydet</button><button onclick="window.open('https://chatgpt.com/','_blank')">📷 ChatGPT ile kalori hesapla</button><small>Fotoğrafı ChatGPT’ye gönder, sonucu buraya gir.</small><div id="foods"></div></section><section><h2>💧 Su takibi</h2><strong id="water"></strong><button onclick="water(250)">+250 ml</button><button onclick="water(500)">+500 ml</button><button onclick="water(-250)">−250 ml</button></section><section><h2>☕ Çay</h2><p id="tea"></p><select id="sugar"><option value="0">Şekersiz<option value="1">1 küp şeker<option value="2">2 küp şeker<option value="3">3 küp şeker</select><button onclick="tea()">Çay ekle</button></section><section><h2>🏋️ Antrenman</h2><select id="sport"><option>Ağırlık antrenmanı<option>Yürüyüş<option>Kardiyo<option>Bisiklet</select><input id="minutes" type="number" min="1" placeholder="Dakika"><button onclick="sport()">Antrenman kaydet</button><div id="sports"></div></section><section><h2>⚖️ Kilo</h2><input id="weight" type="number" min="1" step="0.1" placeholder="kg"><button onclick="weight()">Kiloyu kaydet</button><p id="weightInfo"></p></section><section><h2>📊 Geçmiş kayıtlar</h2><div id="history"></div></section><section><button onclick="unlock()">🔒 Özel alan</button><div id="private" hidden><h2>Alkol takibi</h2><input id="drink" placeholder="İçecek ve miktarı"><input id="drinkCal" type="number" min="1" placeholder="Kalori"><button onclick="add('drinks','drink','drinkCal','')">Kaydet</button><div id="drinks"></div><button onclick="locked=true;render()">Kilitle</button></div></section><script>
const el=id=>document.getElementById(id),KEY='kalori1907_v1';let db={},locked=true;try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let n=new Date();el('date').value=[n.getFullYear(),String(n.getMonth()+1).padStart(2,'0'),String(n.getDate()).padStart(2,'0')].join('-');function day(){return db[el('date').value]??={foods:[],drinks:[],sports:[],water:0,tea:0,weight:0}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Kayıt yapılamadı')}render()}function sum(d){return [...d.foods,...d.drinks].reduce((a,b)=>a+b.cal,0)}function add(k,f,c,p){if(k==='drinks'&&locked)return;let name=el(f).value.trim(),cal=Number(el(c).value);if(!name||!(cal>0))return alert('Bilgileri gir');day()[k].push({name:p+name,cal});el(f).value=el(c).value='';save()}function water(v){day().water=Math.max(0,day().water+v);save()}function tea(){let s=+el('sugar').value;day().tea++;day().foods.push({name:'Çay - '+s+' küp şeker',cal:s*16,tea:true});save()}function sport(){let m=+el('minutes').value;if(!(m>0))return;day().sports.push({name:el('sport').value+' - '+m+' dk'});el('minutes').value='';save()}function weight(){let w=+el('weight').value;if(w>0){day().weight=w;save()}}function unlock(){if(prompt('Şifre')==='1907'){locked=false;render()}else alert('Yanlış şifre')}function row(parent,label,action,btn){let r=document.createElement('div');r.className='item';let s=document.createElement('span');s.textContent=label;let b=document.createElement('button');b.textContent=btn;b.onclick=action;r.append(s,b);parent.append(r)}function list(k){let p=el(k);p.replaceChildren();if(k==='drinks'&&locked)return;day()[k].forEach((x,i)=>row(p,x.name+(x.cal!==undefined?' • '+x.cal+' kcal':''),()=>{if(k==='drinks'&&locked)return;if(confirm('Silinsin mi?')){if(x.tea)day().tea--;day()[k].splice(i,1);save()}},'Sil'))}function render(){let d=day(),t=sum(d);el('total').textContent=t+' kcal alındı';el('bar').value=t;el('remaining').textContent=t>1800?'Hedef aşımı: '+(t-1800)+' kcal':'Kalan: '+(1800-t)+' kcal';el('water').textContent=(d.water/1000).toFixed(2)+' L';el('tea').textContent=d.tea+' bardak';el('weightInfo').textContent=d.weight?d.weight+' kg':'Henüz kayıt yok';el('private').hidden=locked;['foods','sports','drinks'].forEach(list);el('history').replaceChildren();Object.keys(db).sort().reverse().forEach(k=>row(el('history'),k+' • '+sum(db[k])+' kcal',()=>{el('date').value=k;render();scrollTo(0,0)},'Aç'))}render();</script></html>
