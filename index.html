<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalori Açığı</title><style> *{box-sizing:border-box}body{font:16px system-ui;background:#f0f5f2;color:#173b30;max-width:600px;margin:auto;padding:18px}section{background:white;border-radius:18px;padding:18px;margin:12px 0}input,button{font:inherit;padding:12px;border:1px solid #ccd8d1;border-radius:10px;width:100%;margin:5px 0}button{background:#176b50;color:white;border:0}progress{width:100%;accent-color:#176b50}h1,h2{margin:8px 0}small{color:#667} .line{display:flex;justify-content:space-between;align-items:center;gap:8px}.line button{width:auto} </style><h1>Kalori Açığı</h1><input type="date" id="day"><section><small>Günlük hedef: 1.800 kcal</small><h1 id="total"></h1><progress id="bar" max="1800"></progress><p id="remain"></p><p id="macros"></p></section><section><h2>Öğün ekle</h2><input id="food" placeholder="Yemek adı"><input id="cal" type="number" min="0" placeholder="Kalori"><input id="protein" type="number" min="0" placeholder="Protein (g)"><input id="carb" type="number" min="0" placeholder="Karbonhidrat (g)"><input id="fat" type="number" min="0" placeholder="Yağ (g)"><button onclick="add()">Öğünü kaydet</button><a href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT ile fotoğraftan kalori hesapla</a><div id="meals"></div></section><section><h2>Günlük takip</h2><label>Su (litre)<input id="water" type="number" min="0" step="0.1"></label><label>Çay (bardak)<input id="tea" type="number" min="0"></label><label>Şeker (küp)<input id="sugar" type="number" min="0"></label><label>Spor (dakika)<input id="sport" type="number" min="0"></label><label>Kilo (kg)<input id="weight" type="number" min="0" step="0.1"></label><button onclick="save()">Kaydet</button></section><section><h2>Raporlar</h2><button onclick="report(7)">Son 7 gün</button><button onclick="report(30)">Son 30 gün</button><div id="reports"></div><button onclick="backup()">Yedek indir</button><label>Yedek yükle<input type="file" accept=".json" onchange="restore(this)"></label></section><section><button onclick="privateEntry()">Özel kayıt</button><small>Özel kayıt şifreyle şifrelenir; yedeğe dahil edilmez. Alkol kalorilerini günlük toplama ayrıca ekleyebilirsin.</small></section><script>
const $=id=>document.getElementById(id), fields=['water','tea','sugar','sport','weight'];let db=JSON.parse(localStorage.getItem('kalori-v1')||'{}');const date=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;$('day').value=date(new Date());function current(){return db[$('day').value]??={meals:[]}}function persist(){localStorage.setItem('kalori-v1',JSON.stringify(db))}function sum(d,k){return d.meals.reduce((a,b)=>a+(Number(b[k])||0),0)}function render(){let d=current(),n=sum(d,'cal');$('total').textContent=n+' kcal';$('bar').value=n;$('remain').textContent=n<=1800?'Kalan: '+(1800-n)+' kcal':'Hedef üstü: '+(n-1800)+' kcal';$('macros').textContent=`Protein ${sum(d,'protein')} g · Karbonhidrat ${sum(d,'carb')} g · Yağ ${sum(d,'fat')} g`;fields.forEach(k=>$(k).value=d[k]??'');$('meals').replaceChildren();d.meals.forEach((m,i)=>{let row=document.createElement('div');row.className='line';let t=document.createElement('span');t.textContent=m.food+' · '+m.cal+' kcal';let b=document.createElement('button');b.textContent='Sil';b.onclick=()=>{d.meals.splice(i,1);persist();render()};row.append(t,b);$('meals').append(row)})}function save(){fields.forEach(k=>current()[k]=$(k).value);persist()}function add(){if(!$('food').value.trim()||$('cal').value===''||!$('cal').checkValidity())return alert('Yemek adı ve geçerli kalori gir.');save();let m={food:$('food').value};['cal','protein','carb','fat'].forEach(k=>m[k]=Math.max(0,Number($(k).value)||0));current().meals.push(m);persist();['food','cal','protein','carb','fat'].forEach(k=>$(k).value='');render()}$('day').onchange=render;fields.forEach(k=>$(k).onchange=save);function report(n){$('reports').replaceChildren();for(let i=0;i<n;i++){let dt=new Date($('day').value+'T12:00:00');dt.setDate(dt.getDate()-i);let k=date(dt),d=db[k],p=document.createElement('p');p.textContent=k+' — '+(d&&d.meals.length?sum(d,'cal')+' kcal':'Öğün kaydı yok');$('reports').append(p)}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='kalori-yedek.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x||Array.isArray(x)||typeof x!=='object'||!Object.entries(x).every(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&Array.isArray(v.meals)))throw Error();if(confirm('Mevcut kayıtlar yedekle değiştirilsin mi?')){db=x;persist();render()}}catch{alert('Geçersiz yedek')}}async function privateEntry(){try{let pass=prompt('Özel kayıt şifren (unutursan kayıt açılamaz):');if(!pass)return;let enc=new TextEncoder(),old=localStorage.getItem('kalori-private'),salt=old?Uint8Array.from(JSON.parse(old).salt):crypto.getRandomValues(new Uint8Array(16));let base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);let key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);let data={};if(old){let o=JSON.parse(old);data=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:Uint8Array.from(o.iv)},key,Uint8Array.from(o.data))))}let val=prompt('Alkol kaydı (tarih: '+$('day').value+')',data[$('day').value]||'');if(val===null)return;data[$('day').value]=val;let iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(data)));localStorage.setItem('kalori-private',JSON.stringify({salt:[...salt],iv:[...iv],data:[...new Uint8Array(cipher)]}));alert('Özel kayıt kaydedildi')}catch{alert('Şifre yanlış veya güvenli bağlantı gerekli')}}render();</script></html>
